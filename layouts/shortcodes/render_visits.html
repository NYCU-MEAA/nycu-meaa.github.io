<div class="hx-overflow-x-auto hx-mt-4">
  <table class="hx-w-full hx-border-collapse hx-text-left">
    <thead>
      <tr class="hx-border-b hx-border-neutral-200 dark:hx-border-neutral-800">
        <th class="hx-px-4 hx-py-2 hx-font-semibold hx-text-sm" style="width: 20%;">級別與姓氏</th>
        <th class="hx-px-4 hx-py-2 hx-font-semibold hx-text-sm" style="width: 45%;">企業名稱與參訪開放說明</th>
        <th class="hx-px-4 hx-py-2 hx-font-semibold hx-text-sm" style="width: 20%;">廠區地點</th>
        <th class="hx-px-4 hx-py-2 hx-font-semibold hx-text-sm" style="width: 15%;">職稱</th>
      </tr>
    </thead>
    <tbody>
      {{ range .Site.Data.visit_companies }}
      <tr class="hx-border-b hx-border-neutral-100 dark:hx-border-neutral-900">
        <td class="hx-px-4 hx-py-2 hx-font-bold hx-text-sm">{{ .class_info }}級 {{ .surname }}學長</td>
        <td class="hx-px-4 hx-py-2 hx-text-sm">
          <strong>{{ .company }}</strong><br>
          <span class="hx-text-neutral-600 dark:hx-text-neutral-400 hx-leading-relaxed">{{ .notes | markdownify }}</span>
        </td>
        <td class="hx-px-4 hx-py-2 hx-text-sm">{{ if .location }}{{ .location }}{{ else }}（未提供）{{ end }}</td>
        <td class="hx-px-4 hx-py-2 hx-text-sm hx-text-neutral-500 dark:hx-text-neutral-400">{{ .title }}</td>
      </tr>
      {{ end }}
    </tbody>
  </table>
</div>
